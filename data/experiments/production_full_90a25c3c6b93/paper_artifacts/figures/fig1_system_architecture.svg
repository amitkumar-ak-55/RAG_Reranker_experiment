<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4A5568" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3182CE" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38A169" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="550.0" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A202C">Experimental Pipeline Architecture: Three-Arm Controlled Reranker Study</text>
  <text x="550.0" y="52" text-anchor="middle" font-size="12" fill="#718096">Strictly fixed candidate pool (k=10) isolating post-retrieval reranking from retrieval coverage</text>

  <!-- STAGE 1: INPUT & RETRIEVAL -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="220" height="380" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5" />
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">STAGE 1: RETRIEVAL</text>
    
    <!-- Security Query -->
    <rect x="15" y="45" width="190" height="65" rx="6" fill="#FFFFFF" stroke="#CBD5E0" filter="url(#shadow)" />
    <text x="25" y="68" font-size="11" font-weight="bold" fill="#2B6CB0">Evaluation Query (N=300)</text>
    <text x="25" y="85" font-size="10" fill="#4A5568">Natural language vulnerability</text>
    <text x="25" y="99" font-size="10" fill="#718096">description with gold CVE</text>

    <!-- Arrow down -->
    <line x1="110" y1="110" x2="110" y2="135" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Frozen KB -->
    <rect x="15" y="140" width="190" height="95" rx="6" fill="#FFFFFF" stroke="#CBD5E0" filter="url(#shadow)" />
    <text x="25" y="162" font-size="11" font-weight="bold" fill="#2D3748">Frozen Knowledge Base</text>
    <text x="25" y="179" font-size="10" fill="#4A5568">• 17,871 Chunks in SQLite</text>
    <text x="25" y="193" font-size="10" fill="#4A5568">• BGE-base-en-v1.5 (d=768)</text>
    <text x="25" y="207" font-size="10" fill="#4A5568">• 12.4k Nuclei + Confusers</text>
    <text x="25" y="221" font-size="9" fill="#718096">Hash: 84c7755f...</text>

    <!-- Arrow down -->
    <line x1="110" y1="235" x2="110" y2="260" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Hybrid RRF Engine -->
    <rect x="15" y="265" width="190" height="95" rx="6" fill="#EBF8FF" stroke="#3182CE" stroke-width="1.5" filter="url(#shadow)" />
    <text x="25" y="287" font-size="11" font-weight="bold" fill="#2B6CB0">Hybrid Search + RRF</text>
    <text x="25" y="304" font-size="10" fill="#2D3748">• Dense Vector Search (Top 50)</text>
    <text x="25" y="318" font-size="10" fill="#2D3748">• BM25 Sparse Search (Top 50)</text>
    <text x="25" y="332" font-size="10" fill="#2D3748">• Reciprocal Rank Fusion</text>
    <text x="25" y="347" font-size="10" font-weight="bold" fill="#C53030">Output: Fixed Pool (k=10)</text>
  </g>

  <!-- Arrow from Stage 1 to Stage 2 -->
  <line x1="260" y1="392" x2="310" y2="392" stroke="#4A5568" stroke-width="2" />
  <line x1="310" y1="180" x2="310" y2="440" stroke="#4A5568" stroke-width="2" />
  
  <line x1="310" y1="180" x2="350" y2="180" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="310" y1="270" x2="350" y2="270" stroke="#3182CE" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="310" y1="380" x2="350" y2="380" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- STAGE 2: 3-ARM RERANKING -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="360" height="380" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5" />
    <text x="180" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">STAGE 2: POST-RETRIEVAL RERANKING</text>
    
    <!-- Arm A -->
    <rect x="15" y="45" width="330" height="80" rx="6" fill="#FFFFFF" stroke="#A0AEC0" filter="url(#shadow)" />
    <text x="25" y="68" font-size="11" font-weight="bold" fill="#4A5568">Arm A: Hybrid Baseline (No Reranker)</text>
    <text x="25" y="85" font-size="10" fill="#718096">• Retains original Reciprocal Rank Fusion order</text>
    <text x="25" y="99" font-size="10" fill="#718096">• Recall@1: 56.33% | MRR@10: 0.6920 | Latency: 0 ms</text>
    <text x="25" y="113" font-size="10" font-weight="bold" fill="#4A5568">Selects: Top-5 Original Chunks</text>

    <!-- Arm B -->
    <rect x="15" y="135" width="330" height="90" rx="6" fill="#EBF8FF" stroke="#3182CE" filter="url(#shadow)" />
    <text x="25" y="157" font-size="11" font-weight="bold" fill="#2B6CB0">Arm B: Hosted Cross-Encoder (Jina v3.5)</text>
    <text x="25" y="174" font-size="10" fill="#2D3748">• Full cross-attention query-candidate scoring</text>
    <text x="25" y="188" font-size="10" fill="#2D3748">• Recall@1: 74.00% | MRR@10: 0.8201 | Latency: 1,373 ms</text>
    <text x="25" y="202" font-size="10" font-weight="bold" fill="#2B6CB0">Selects: Top-5 Cross-Encoder Ranked Chunks</text>
    <text x="25" y="216" font-size="9" fill="#718096">jina-reranker-v3.5 multi-key rotator</text>

    <!-- Arm C -->
    <rect x="15" y="235" width="330" height="130" rx="6" fill="#F0FFF4" stroke="#38A169" stroke-width="2" filter="url(#shadow)" />
    <rect x="250" y="242" width="85" height="18" rx="4" fill="#38A169" />
    <text x="292" y="255" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFFFFF">TOP PERFORMER</text>
    <text x="25" y="258" font-size="11" font-weight="bold" fill="#22543D">Arm C: TypeSafe JEV (Deductive Engine)</text>
    <text x="25" y="275" font-size="10" fill="#22543D">• Single-shot batch POST /v1/systemone (10 Noul questions)</text>
    <text x="25" y="289" font-size="10" fill="#22543D">• Independent factual claim verification against evidence</text>
    <text x="25" y="303" font-size="10" font-weight="bold" fill="#22543D">• Recall@1: 83.00% (+9.0%) | MRR@10: 0.8767 (+0.057)</text>
    <text x="25" y="317" font-size="10" font-weight="bold" fill="#22543D">• Latency: 1,003 ms (27% faster than Jina)</text>
    <text x="25" y="331" font-size="10" font-weight="bold" fill="#276749">Selects: Top-5 Deductively Verified Chunks</text>
    <text x="25" y="347" font-size="9" font-weight="bold" fill="#2F855A">Statistically Significant: p = 0.0002 vs Jina (Holm-adj)</text>
  </g>

  <!-- Arrows from Stage 2 to Stage 3 -->
  <line x1="710" y1="125" x2="760" y2="125" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="710" y1="225" x2="760" y2="225" stroke="#3182CE" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="710" y1="340" x2="760" y2="340" stroke="#38A169" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- STAGE 3: GENERATION & EVALUATION -->
  <g transform="translate(760, 80)">
    <rect x="0" y="0" width="300" height="380" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="1.5" />
    <text x="150" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D3748">STAGE 3: GENERATION &amp; EVAL</text>
    
    <!-- Generator -->
    <rect x="15" y="45" width="270" height="120" rx="6" fill="#FFFFFF" stroke="#CBD5E0" filter="url(#shadow)" />
    <text x="25" y="68" font-size="11" font-weight="bold" fill="#2D3748">Downstream Answer Generator</text>
    <text x="25" y="85" font-size="10" fill="#4A5568">• Model: openai/gpt-oss-120b</text>
    <text x="25" y="99" font-size="10" fill="#4A5568">• Input: Query + Arm's Top-5 Chunks</text>
    <text x="25" y="113" font-size="10" fill="#4A5568">• Max Tokens: 256, Temp: null</text>
    <text x="25" y="127" font-size="10" fill="#4A5568">• Required citation: [E1]...[E5]</text>
    <text x="25" y="145" font-size="10" font-weight="bold" fill="#2B6CB0">900 Generations (894 Successes)</text>

    <!-- Arrow down -->
    <line x1="150" y1="165" x2="150" y2="190" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Evaluation Engine -->
    <rect x="15" y="195" width="270" height="170" rx="6" fill="#FFFFFF" stroke="#CBD5E0" filter="url(#shadow)" />
    <text x="25" y="217" font-size="11" font-weight="bold" fill="#2D3748">Rigorous Dual Evaluation</text>
    <text x="25" y="234" font-size="10" font-weight="bold" fill="#718096">1. Extrinsic Answer Verification:</text>
    <text x="25" y="248" font-size="10" fill="#4A5568">• Unambiguous Gold Match: 77.33% (JEV)</text>
    <text x="25" y="262" font-size="10" fill="#4A5568">• Refusal Drop: 7.33% to 3.33% (JEV)</text>
    
    <text x="25" y="282" font-size="10" font-weight="bold" fill="#718096">2. Statistical Hypothesis Testing:</text>
    <text x="25" y="296" font-size="10" fill="#4A5568">• 10k-Iteration Paired Bootstrap CIs</text>
    <text x="25" y="310" font-size="10" fill="#4A5568">• Wilcoxon Signed-Rank Tests</text>
    <text x="25" y="324" font-size="10" fill="#4A5568">• Holm-Bonferroni Correction</text>
    <text x="25" y="345" font-size="10" font-weight="bold" fill="#22543D">Result: Statistically Sound Artifacts</text>
  </g>
</svg>